<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" id="themeColor" content="#EDF0F4" />
  <script>
    // 테마(기기별 설정): light(기본) / dark / auto. 화면이 그려지기 전에 적용해 깜빡임 방지
    (function () {
      var t = 'light'; try { t = localStorage.getItem('eok.theme') || 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.getElementById('themeColor').setAttribute('content', dark ? '#0C1220' : '#EDF0F4');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="억" />
  <title>억</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1 id="title">억</h1>
    <div class="month-picker" id="monthPicker">
      <button class="icon-btn" id="prevMonth" aria-label="이전 달">‹</button>
      <button id="monthLabel" class="month-btn" aria-label="기간 선택"></button>
      <button class="icon-btn" id="nextMonth" aria-label="다음 달">›</button>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="거래 추가"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabbar">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>홈</button>
    <button data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>내역</button>
    <button data-tab="fixed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>고정</button>
    <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>목표</button>
    <button data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.8V16h5v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3z"/></svg>조언</button>
  </nav>

  <dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>

  <script src="version.js"></script>
  <script src="parser.js"></script>
  <script src="sync-core.js"></script>
  <script src="guide.js"></script>
  <script src="ai.js"></script>
  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
